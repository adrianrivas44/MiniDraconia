name: Windows tests
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scripted-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved during candidate preparation
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved during candidate preparation
        with:
          python-version: '3.11'
      - name: Install test and build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run isolated tests
        run: python scripts/run_tests.py
# This workflow does not publish a release. Frozen-package startup and human
# visual/audio checks remain separate release gates.
